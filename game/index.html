<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOMETA — Comet Courier</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #05071d;
    min-height: 100vh;
  }
  body {
    display: grid;
    place-items: center;
  }
  canvas#game {
    width: min(100vw, 160vh);
    aspect-ratio: 16 / 10;
    display: block;
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
    touch-action: none;
    cursor: crosshair;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800"></canvas>
<noscript>KOMETA needs JavaScript to fly.</noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
